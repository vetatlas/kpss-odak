<!DOCTYPE html><html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KPSS Tarih Testi</title><style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3f6fb;
    color: #172033;
}

.container {
    width: 100%;
    max-width: 850px;
    margin: auto;
    padding: 12px;
}

/* HEADER */

header {
    background: #172554;
    color: white;
    padding: 20px;
    border-radius: 18px;
    margin-bottom: 15px;
}

header h1 {
    margin: 0 0 8px;
    font-size: 23px;
}

.header-info {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
}

/* BAŞLANGIÇ */

.start-screen {
    background: white;
    border-radius: 20px;
    padding: 30px 22px;
    text-align: center;
    box-shadow: 0 5px 20px rgba(0,0,0,.06);
}

.start-screen h2 {
    font-size: 27px;
    margin-top: 0;
}

.file-box {
    margin: 25px 0;
    padding: 22px;
    border: 2px dashed #93c5fd;
    background: #eff6ff;
    border-radius: 15px;
}

.file-label {
    display: inline-block;
    background: #2563eb;
    color: white;
    padding: 14px 22px;
    border-radius: 12px;
    font-weight: bold;
    cursor: pointer;
}

#jsonFile {
    display: none;
}

.file-status {
    margin-top: 15px;
    font-size: 14px;
    font-weight: bold;
}

.start-btn {
    border: none;
    background: #2563eb;
    color: white;
    padding: 16px 35px;
    border-radius: 12px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.start-btn:disabled {
    background: #94a3b8;
    cursor: not-allowed;
}

/* PROGRESS */

.progress-box {
    background: white;
    padding: 15px;
    border-radius: 15px;
    margin-bottom: 15px;
}

.progress-top {
    display: flex;
    justify-content: space-between;
    margin-bottom: 9px;
    font-weight: bold;
}

.progress {
    height: 9px;
    background: #e5e7eb;
    border-radius: 20px;
    overflow: hidden;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: #2563eb;
    transition: width .3s ease;
}

/* QUESTION */

.question-card {
    background: white;
    border-radius: 18px;
    padding: 24px;
    box-shadow: 0 5px 20px rgba(0,0,0,.06);
}

.question-number {
    color: #2563eb;
    font-weight: bold;
    margin-bottom: 12px;
}

.question-meta {
    display: flex;
    gap: 8px;
    margin-bottom: 15px;
    flex-wrap: wrap;
}

.badge {
    background: #eef2ff;
    color: #3730a3;
    padding: 5px 9px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: bold;
}

.question {
    font-size: 19px;
    line-height: 1.6;
    font-weight: 600;
    margin-bottom: 22px;
}

/* OPTIONS */

.option {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px;
    border: 2px solid #e5e7eb;
    border-radius: 13px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: .2s;
}

.option:hover {
    border-color: #93c5fd;
    background: #eff6ff;
}

.option-letter {
    min-width: 32px;
    height: 32px;
    border-radius: 50%;
    background: #eef2ff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
}

.option-text {
    line-height: 1.5;
    padding-top: 5px;
}

.option.correct {
    background: #dcfce7;
    border-color: #22c55e;
}

.option.wrong {
    background: #fee2e2;
    border-color: #ef4444;
}

.option.disabled {
    cursor: default;
}

/* EXPLANATION */

.explanation {
    display: none;
    margin-top: 18px;
    padding: 15px;
    background: #f8fafc;
    border-left: 4px solid #2563eb;
    border-radius: 8px;
    line-height: 1.6;
}

/* BUTTONS */

.buttons {
    display: flex;
    gap: 10px;
    margin-top: 20px;
}

button {
    border: 0;
    padding: 14px 20px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 15px;
    font-weight: bold;
}

.next-btn {
    background: #2563eb;
    color: white;
    flex: 1;
}

.next-btn:disabled {
    background: #94a3b8;
    cursor: not-allowed;
}

.back-btn {
    background: #e5e7eb;
}

/* RESULT */

.result-screen {
    background: white;
    border-radius: 20px;
    padding: 30px 22px;
    text-align: center;
    box-shadow: 0 5px 20px rgba(0,0,0,.06);
}

.result-screen h2 {
    font-size: 27px;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin: 25px 0;
}

.stat {
    padding: 20px;
    background: #f8fafc;
    border-radius: 14px;
}

.stat strong {
    display: block;
    font-size: 28px;
    margin-bottom: 5px;
}

.net-box {
    padding: 20px;
    background: #eff6ff;
    border-radius: 14px;
    margin-bottom: 20px;
}

.net-box strong {
    display: block;
    font-size: 35px;
    color: #2563eb;
}

/* MOBILE */

@media(max-width:600px) {

    .container {
        padding: 8px;
    }

    .question-card {
        padding: 18px;
    }

    .question {
        font-size: 17px;
    }

    .stats {
        grid-template-columns: 1fr;
    }

    .header-info {
        flex-direction: column;
        gap: 5px;
    }

    .buttons {
        flex-direction: column;
    }

    .back-btn,
    .next-btn {
        width: 100%;
    }
}
</style></head><body><div class="container"><header>
    <h1>📚 KPSS Tarih Testi</h1><div class="header-info">
    <span>Ortaöğretim</span>
    <span id="timer">⏱️ 00:00</span>
</div>

</header><!-- BAŞLANGIÇ EKRANI --><div id="startScreen" class="start-screen"><h2>KPSS Tarih Testi</h2>

<p>
    JSON dosyanı yükle ve teste başla.
</p>

<div class="file-box">

    <label class="file-label" for="jsonFile">
        📂 JSON Dosyasını Seç
    </label>

    <input
        type="file"
        id="jsonFile"
        accept=".json,application/json"
    >

    <div
        id="fileStatus"
        class="file-status">
        Henüz dosya seçilmedi.
    </div>

</div>

<p>
    Toplam soru:
    <strong id="totalQuestionText">0</strong>
</p>

<br>

<button
    id="startButton"
    class="start-btn"
    onclick="startTest()"
    disabled>
    TESTE BAŞLA
</button>

</div><!-- TEST EKRANI --><div
    id="testScreen"
    style="display:none;"><div class="progress-box">

    <div class="progress-top">

        <span id="questionCounter">
            1 / 100
        </span>

        <span id="percent">
            0%
        </span>

    </div>

    <div class="progress">

        <div
            id="progressBar"
            class="progress-bar">
        </div>

    </div>

</div>


<div class="question-card">

    <div
        id="questionNumber"
        class="question-number">
        Soru 1
    </div>


    <div
        id="questionMeta"
        class="question-meta">
    </div>


    <div
        id="questionText"
        class="question">
    </div>


    <div id="options"></div>


    <div
        id="explanation"
        class="explanation">
    </div>


    <div class="buttons">

        <button
            id="backButton"
            class="back-btn"
            onclick="previousQuestion()">

            ← Önceki

        </button>


        <button
            id="nextButton"
            class="next-btn"
            onclick="nextQuestion()"
            disabled>

            Sonraki →

        </button>

    </div>

</div>

</div><!-- SONUÇ EKRANI --><div
    id="resultScreen"
    class="result-screen"
    style="display:none;"><h2>🎉 Test Tamamlandı</h2>

<div class="stats">

    <div class="stat">
        <strong id="correctResult">0</strong>
        Doğru
    </div>

    <div class="stat">
        <strong id="wrongResult">0</strong>
        Yanlış
    </div>

    <div class="stat">
        <strong id="emptyResult">0</strong>
        Boş
    </div>

</div>


<div class="net-box">

    <strong id="netResult">0</strong>

    NET

</div>


<button
    class="start-btn"
    onclick="restartTest()">

    🔄 Yeniden Başla

</button>

</div></div><script>

/* =====================================================
   DEĞİŞKENLER
   ===================================================== */

let sorular = [];

let mevcutSoru = 0;

let cevaplar = {};

let saniye = 0;

let timerInterval;


/* =====================================================
   JSON DOSYASINI SEÇ
   ===================================================== */

document
.getElementById("jsonFile")
.addEventListener("change", function(event) {

    const dosya = event.target.files[0];

    if (!dosya) {
        return;
    }


    const okuyucu = new FileReader();


    okuyucu.onload = function(e) {

        try {

            const veri =
                JSON.parse(e.target.result);


            if (!Array.isArray(veri)) {

                throw new Error(
                    "JSON bir dizi olmalı."
                );

            }


            if (veri.length === 0) {

                throw new Error(
                    "JSON dosyasında soru yok."
                );

            }


            /*
             * Soruları kontrol et
             */

            veri.forEach((soru, index) => {

                if (
                    !soru.soru ||
                    !soru.secenekler ||
                    !soru.cevap
                ) {

                    throw new Error(
                        `${index + 1}. soruda eksik alan var.`
                    );

                }

            });


            sorular = veri;


            document.getElementById(
                "totalQuestionText"
            ).textContent =
                sorular.length;


            document.getElementById(
                "fileStatus"
            ).textContent =
                "✅ " +
                dosya.name +
                " yüklendi";


            document.getElementById(
                "fileStatus"
            ).style.color =
                "#16a34a";


            document.getElementById(
                "startButton"
            ).disabled = false;


        } catch (hata) {

            sorular = [];


            document.getElementById(
                "totalQuestionText"
            ).textContent = "0";


            document.getElementById(
                "startButton"
            ).disabled = true;


            document.getElementById(
                "fileStatus"
            ).textContent =
                "❌ JSON hatası: " +
                hata.message;


            document.getElementById(
                "fileStatus"
            ).style.color =
                "#dc2626";

        }

    };


    okuyucu.onerror = function() {

        alert(
            "JSON dosyası okunamadı."
        );

    };


    okuyucu.readAsText(dosya, "UTF-8");

});


/* =====================================================
   TESTİ BAŞLAT
   ===================================================== */

function startTest() {

    if (sorular.length === 0) {

        alert(
            "Önce JSON dosyasını seç."
        );

        return;
    }


    mevcutSoru = 0;

    cevaplar = {};

    saniye = 0;


    document.getElementById(
        "startScreen"
    ).style.display = "none";


    document.getElementById(
        "resultScreen"
    ).style.display = "none";


    document.getElementById(
        "testScreen"
    ).style.display = "block";


    clearInterval(timerInterval);


    timerInterval =
        setInterval(function() {

            saniye++;


            const dakika =
                Math.floor(
                    saniye / 60
                );


            const saniyeKismi =
                saniye % 60;


            document.getElementById(
                "timer"
            ).textContent =
                "⏱️ " +
                String(dakika).padStart(2, "0") +
                ":" +
                String(saniyeKismi).padStart(2, "0");


        }, 1000);


    soruyuGoster();

}


/* =====================================================
   SORUYU GÖSTER
   ===================================================== */

function soruyuGoster() {

    const soru =
        sorular[mevcutSoru];


    const toplam =
        sorular.length;


    document.getElementById(
        "questionCounter"
    ).textContent =
        `${mevcutSoru + 1} / ${toplam}`;


    const yuzde =
        Math.round(
            ((mevcutSoru + 1) / toplam) * 100
        );


    document.getElementById(
        "percent"
    ).textContent =
        yuzde + "%";


    document.getElementById(
        "progressBar"
    ).style.width =
        yuzde + "%";


    document.getElementById(
        "questionNumber"
    ).textContent =
        "Soru " +
        (mevcutSoru + 1);


    document.getElementById(
        "questionText"
    ).textContent =
        soru.soru;


    /* KONU BİLGİLERİ */

    const meta =
        document.getElementById(
            "questionMeta"
        );


    meta.innerHTML = "";


    if (soru.konu) {

        meta.innerHTML +=
            `<span class="badge">
                ${soru.konu}
            </span>`;

    }


    if (soru.altKonu) {

        meta.innerHTML +=
            `<span class="badge">
                ${soru.altKonu}
            </span>`;

    }


    if (soru.zorluk) {

        meta.innerHTML +=
            `<span class="badge">
                ${soru.zorluk}
            </span>`;

    }


    /* SEÇENEKLER */

    const options =
        document.getElementById(
            "options"
        );


    options.innerHTML = "";


    const harfler =
        ["A", "B", "C", "D", "E"];


    harfler.forEach(function(harf) {

        if (
            soru.secenekler[harf] === undefined
        ) {
            return;
        }


        const div =
            document.createElement("div");


        div.className = "option";


        div.innerHTML = `

            <div class="option-letter">
                ${harf}
            </div>

            <div class="option-text">
                ${soru.secenekler[harf]}
            </div>

        `;


        div.onclick = function() {

            cevapSec(harf);

        };


        options.appendChild(div);

    });


    document.getElementById(
        "explanation"
    ).style.display = "none";


    document.getElementById(
        "explanation"
    ).textContent = "";


    document.getElementById(
        "nextButton"
    ).disabled = true;


    document.getElementById(
        "backButton"
    ).disabled =
        mevcutSoru === 0;


    /* ÖNCEKİ CEVABI GÖSTER */

    if (
        cevaplar[mevcutSoru]
    ) {

        cevabiGoster(
            cevaplar[mevcutSoru]
        );

    }

}


/* =====================================================
   CEVAP SEÇ
   ===================================================== */

function cevapSec(harf) {

    if (
        cevaplar[mevcutSoru]
    ) {

        return;

    }


    cevaplar[mevcutSoru] =
        harf;


    cevabiGoster(harf);

}


/* =====================================================
   CEVABI GÖSTER
   ===================================================== */

function cevabiGoster(harf) {

    const soru =
        sorular[mevcutSoru];


    const secenekler =
        document.querySelectorAll(
            ".option"
        );


    secenekler.forEach(function(option) {

        option.classList.add(
            "disabled"
        );


        const optionHarf =
            option
            .querySelector(
                ".option-letter"
            )
            .textContent
            .trim();


        if (
            optionHarf === soru.cevap
        ) {

            option.classList.add(
                "correct"
            );

        }


        if (
            optionHarf === harf &&
            harf !== soru.cevap
        ) {

            option.classList.add(
                "wrong"
            );

        }

    });


    document.getElementById(
        "explanation"
    ).textContent =
        "💡 " +
        (soru.aciklama ||
        "Açıklama bulunmuyor.");


    document.getElementById(
        "explanation"
    ).style.display =
        "block";


    document.getElementById(
        "nextButton"
    ).disabled = false;

}


/* =====================================================
   SONRAKİ SORU
   ===================================================== */

function nextQuestion() {

    if (
        !cevaplar[mevcutSoru]
    ) {

        return;

    }


    if (
        mevcutSoru <
        sorular.length - 1
    ) {

        mevcutSoru++;

        soruyuGoster();

    }

    else {

        testiBitir();

    }

}


/* =====================================================
   ÖNCEKİ SORU
   ===================================================== */

function previousQuestion() {

    if (
        mevcutSoru > 0
    ) {

        mevcutSoru--;

        soruyuGoster();

    }

}


/* =====================================================
   TESTİ BİTİR
   ===================================================== */

function testiBitir() {

    clearInterval(timerInterval);


    let dogru = 0;

    let yanlis = 0;

    let bos = 0;


    sorular.forEach(
        function(soru, index) {

            const cevap =
                cevaplar[index];


            if (!cevap) {

                bos++;

            }

            else if (
                cevap === soru.cevap
            ) {

                dogru++;

            }

            else {

                yanlis++;

            }

        }
    );


    /* KPSS NET */

    const net =
        dogru -
        (yanlis / 4);


    document.getElementById(
        "correctResult"
    ).textContent =
        dogru;


    document.getElementById(
        "wrongResult"
    ).textContent =
        yanlis;


    document.getElementById(
        "emptyResult"
    ).textContent =
        bos;


    document.getElementById(
        "netResult"
    ).textContent =
        net.toFixed(2);


    document.getElementById(
        "testScreen"
    ).style.display =
        "none";


    document.getElementById(
        "resultScreen"
    ).style.display =
        "block";

}


/* =====================================================
   YENİDEN BAŞLAT
   ===================================================== */

function restartTest() {

    clearInterval(timerInterval);


    mevcutSoru = 0;

    cevaplar = {};

    saniye = 0;


    document.getElementById(
        "resultScreen"
    ).style.display =
        "none";


    document.getElementById(
        "startScreen"
    ).style.display =
        "block";


    document.getElementById(
        "timer"
    ).textContent =
        "⏱️ 00:00";

}

</script></body>
</html>
