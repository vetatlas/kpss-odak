<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KPSS Tarih</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f7fb;
    color:#172033;
}

.container{
    max-width:850px;
    margin:auto;
    padding:15px;
}

/* HEADER */

.header{
    background:#172554;
    color:white;
    padding:22px;
    border-radius:20px;
    margin-bottom:15px;
}

.header h1{
    margin:0 0 8px;
    font-size:24px;
}

.header-info{
    display:flex;
    justify-content:space-between;
    font-size:14px;
}

/* EKRANLAR */

.screen{
    background:white;
    border-radius:20px;
    padding:25px;
    box-shadow:0 5px 25px rgba(0,0,0,.06);
}

/* BAŞLANGIÇ */

.start-title{
    text-align:center;
    font-size:28px;
    margin-top:5px;
}

.question-counts{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin:25px 0;
}

.count-btn{
    border:2px solid #e5e7eb;
    background:white;
    padding:20px 10px;
    border-radius:15px;
    cursor:pointer;
    font-size:18px;
    font-weight:bold;
    transition:.2s;
}

.count-btn:hover{
    border-color:#2563eb;
    background:#eff6ff;
}

.count-btn.selected{
    border-color:#2563eb;
    background:#2563eb;
    color:white;
}

.start-btn{
    width:100%;
    border:0;
    padding:16px;
    background:#2563eb;
    color:white;
    border-radius:13px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.start-btn:disabled{
    background:#94a3b8;
}

/* PROGRESS */

.progress-box{
    background:white;
    padding:15px;
    border-radius:15px;
    margin-bottom:15px;
}

.progress-info{
    display:flex;
    justify-content:space-between;
    font-weight:bold;
    margin-bottom:8px;
}

.progress{
    width:100%;
    height:9px;
    background:#e5e7eb;
    border-radius:20px;
    overflow:hidden;
}

.progress-bar{
    height:100%;
    width:0;
    background:#2563eb;
    transition:.3s;
}

/* SORU */

.question-card{
    background:white;
    border-radius:20px;
    padding:25px;
    box-shadow:0 5px 25px rgba(0,0,0,.06);
}

.question-number{
    color:#2563eb;
    font-weight:bold;
    margin-bottom:10px;
}

.tags{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
    margin-bottom:15px;
}

.tag{
    background:#eef2ff;
    color:#3730a3;
    padding:5px 9px;
    border-radius:7px;
    font-size:12px;
    font-weight:bold;
}

.question{
    font-size:19px;
    line-height:1.6;
    font-weight:bold;
    margin-bottom:22px;
}

/* SEÇENEK */

.option{
    display:flex;
    gap:12px;
    align-items:flex-start;
    border:2px solid #e5e7eb;
    padding:14px;
    border-radius:13px;
    margin-bottom:10px;
    cursor:pointer;
    transition:.2s;
}

.option:hover{
    border-color:#93c5fd;
    background:#eff6ff;
}

.option-letter{
    width:32px;
    height:32px;
    min-width:32px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:#eef2ff;
    font-weight:bold;
}

.option-text{
    line-height:1.5;
    padding-top:5px;
}

.option.correct{
    background:#dcfce7;
    border-color:#22c55e;
}

.option.wrong{
    background:#fee2e2;
    border-color:#ef4444;
}

.option.disabled{
    cursor:default;
}

/* AÇIKLAMA */

.explanation{
    display:none;
    margin-top:18px;
    padding:15px;
    border-left:4px solid #2563eb;
    background:#f8fafc;
    border-radius:8px;
    line-height:1.6;
}

/* BUTONLAR */

.buttons{
    display:flex;
    gap:10px;
    margin-top:20px;
}

button{
    font-family:inherit;
}

.back-btn{
    border:0;
    padding:14px 20px;
    border-radius:12px;
    background:#e5e7eb;
    font-weight:bold;
    cursor:pointer;
}

.next-btn{
    flex:1;
    border:0;
    padding:14px 20px;
    border-radius:12px;
    background:#2563eb;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.next-btn:disabled{
    background:#94a3b8;
    cursor:not-allowed;
}

/* SONUÇ */

.result{
    text-align:center;
}

.result h2{
    font-size:28px;
}

.result-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin:25px 0;
}

.result-box{
    background:#f8fafc;
    padding:20px;
    border-radius:14px;
}

.result-box strong{
    display:block;
    font-size:30px;
    margin-bottom:5px;
}

.net{
    background:#eff6ff;
    padding:20px;
    border-radius:15px;
    margin-bottom:20px;
}

.net strong{
    display:block;
    font-size:38px;
    color:#2563eb;
}

/* HATA */

.error{
    background:#fee2e2;
    color:#991b1b;
    padding:15px;
    border-radius:12px;
    line-height:1.5;
}

/* MOBİL */

@media(max-width:600px){

    .container{
        padding:9px;
    }

    .screen,
    .question-card{
        padding:18px;
    }

    .question{
        font-size:17px;
    }

    .question-counts{
        grid-template-columns:1fr;
    }

    .result-grid{
        grid-template-columns:1fr;
    }

    .buttons{
        flex-direction:column;
    }

    .back-btn,
    .next-btn{
        width:100%;
    }

    .header-info{
        flex-direction:column;
        gap:5px;
    }
}
</style>
</head>

<body>

<div class="container">

<!-- HEADER -->

<div class="header">

    <h1>📚 KPSS Tarih</h1>

    <div class="header-info">

        <span>Ortaöğretim</span>

        <span id="timer">⏱️ 00:00</span>

    </div>

</div>


<!-- BAŞLANGIÇ -->

<div id="startScreen" class="screen">

    <h2 class="start-title">
        KPSS Tarih Testi
    </h2>

    <p style="text-align:center">
        Soru sayısını seç ve teste başla.
    </p>

    <div class="question-counts">

        <button
            class="count-btn"
            onclick="selectCount(20,this)">
            20 SORU
        </button>

        <button
            class="count-btn"
            onclick="selectCount(50,this)">
            50 SORU
        </button>

        <button
            class="count-btn selected"
            onclick="selectCount(100,this)">
            100 SORU
        </button>

    </div>

    <p style="text-align:center">

        Bankadaki soru:
        <strong id="bankCount">Yükleniyor...</strong>

    </p>

    <div
        id="loadStatus"
        style="text-align:center;margin:15px 0">
    </div>

    <button
        id="startBtn"
        class="start-btn"
        onclick="startTest()"
        disabled>

        TESTE BAŞLA

    </button>

</div>


<!-- TEST -->

<div
    id="testArea"
    style="display:none">

    <div class="progress-box">

        <div class="progress-info">

            <span id="questionCounter">
                1 / 100
            </span>

            <span id="percent">
                1%
            </span>

        </div>

        <div class="progress">

            <div
                id="progressBar"
                class="progress-bar">
            </div>

        </div>

    </div>


    <div class="question-card">

        <div
            id="questionNumber"
            class="question-number">
        </div>

        <div
            id="tags"
            class="tags">
        </div>

        <div
            id="questionText"
            class="question">
        </div>

        <div id="options"></div>

        <div
            id="explanation"
            class="explanation">
        </div>

        <div class="buttons">

            <button
                id="backBtn"
                class="back-btn"
                onclick="previousQuestion()">

                ← Önceki

            </button>

            <button
                id="nextBtn"
                class="next-btn"
                onclick="nextQuestion()"
                disabled>

                Sonraki →

            </button>

        </div>

    </div>

</div>


<!-- SONUÇ -->

<div
    id="resultScreen"
    class="screen result"
    style="display:none">

    <h2>🎉 Test Bitti</h2>

    <div class="result-grid">

        <div class="result-box">
            <strong id="correct">0</strong>
            Doğru
        </div>

        <div class="result-box">
            <strong id="wrong">0</strong>
            Yanlış
        </div>

        <div class="result-box">
            <strong id="empty">0</strong>
            Boş
        </div>

    </div>

    <div class="net">

        <strong id="net">0.00</strong>

        NET

    </div>

    <button
        class="start-btn"
        onclick="returnHome()">

        🔄 Yeni Test

    </button>

</div>

</div>


<script>

/* ==================================================
   AYARLAR
   ================================================== */

const JSON_DOSYASI = "sorular.json";

let tumSorular = [];

let testSorulari = [];

let cevaplar = {};

let mevcutSoru = 0;

let soruSayisi = 100;

let saniye = 0;

let timer;


/* ==================================================
   JSON'U OTOMATİK YÜKLE
   ================================================== */

async function sorulariYukle(){

    try{

        const response =
            await fetch(JSON_DOSYASI);

        if(!response.ok){

            throw new Error(
                "sorular.json bulunamadı."
            );

        }

        const data =
            await response.json();

        if(!Array.isArray(data)){

            throw new Error(
                "JSON formatı hatalı."
            );

        }

        tumSorular = data;

        document.getElementById(
            "bankCount"
        ).textContent =
            tumSorular.length + " soru";

        document.getElementById(
            "loadStatus"
        ).innerHTML =
            "✅ Soru bankası hazır.";

        document.getElementById(
            "startBtn"
        ).disabled = false;

    }

    catch(error){

        document.getElementById(
            "bankCount"
        ).textContent =
            "Yüklenemedi";

        document.getElementById(
            "loadStatus"
        ).innerHTML = `
            <div class="error">
                ❌ Sorular yüklenemedi.<br><br>
                <b>sorular.json</b> dosyasının
                index.html ile aynı klasörde
                olduğundan emin ol.
                <br><br>
                Eğer HTML'yi doğrudan cihazdan
                açıyorsan, GitHub Pages veya
                benzeri bir web alanında çalıştır.
            </div>
        `;

        console.error(error);
    }
}


/* ==================================================
   SORU SAYISI
   ================================================== */

function selectCount(count, button){

    soruSayisi = count;

    document
        .querySelectorAll(".count-btn")
        .forEach(btn =>
            btn.classList.remove("selected")
        );

    button.classList.add("selected");
}


/* ==================================================
   DİZİYİ KARIŞTIR
   ================================================== */

function karistir(array){

    const yeni =
        [...array];

    for(
        let i = yeni.length - 1;
        i > 0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            yeni[i],
            yeni[j]
        ] =
        [
            yeni[j],
            yeni[i]
        ];

    }

    return yeni;
}


/* ==================================================
   TESTİ BAŞLAT
   ================================================== */

function startTest(){

    if(
        tumSorular.length < soruSayisi
    ){

        alert(
            `Soru bankasında sadece ${tumSorular.length} soru var.`
        );

        return;
    }


    /*
       Soru bankasından seçilen sayıda
       rastgele soru al
    */

    testSorulari =
        karistir(tumSorular)
        .slice(0,soruSayisi);


    cevaplar = {};

    mevcutSoru = 0;

    saniye = 0;


    document.getElementById(
        "startScreen"
    ).style.display = "none";


    document.getElementById(
        "resultScreen"
    ).style.display = "none";


    document.getElementById(
        "testArea"
    ).style.display = "block";


    clearInterval(timer);


    timer =
        setInterval(() => {

            saniye++;

            const dakika =
                Math.floor(
                    saniye / 60
                );

            const saniyeKismi =
                saniye % 60;

            document.getElementById(
                "timer"
            ).textContent =
                "⏱️ " +
                String(dakika).padStart(2,"0") +
                ":" +
                String(saniyeKismi).padStart(2,"0");

        },1000);


    soruyuGoster();
}


/* ==================================================
   SORUYU GÖSTER
   ================================================== */

function soruyuGoster(){

    const soru =
        testSorulari[mevcutSoru];


    const toplam =
        testSorulari.length;


    const numara =
        mevcutSoru + 1;


    const yuzde =
        Math.round(
            (numara / toplam) * 100
        );


    document.getElementById(
        "questionCounter"
    ).textContent =
        `${numara} / ${toplam}`;


    document.getElementById(
        "percent"
    ).textContent =
        yuzde + "%";


    document.getElementById(
        "progressBar"
    ).style.width =
        yuzde + "%";


    document.getElementById(
        "questionNumber"
    ).textContent =
        "Soru " + numara;


    document.getElementById(
        "questionText"
    ).textContent =
        soru.soru;


    /* ETİKETLER */

    const tags =
        document.getElementById("tags");

    tags.innerHTML = "";


    if(soru.konu){

        tags.innerHTML +=
            `<span class="tag">
                ${soru.konu}
            </span>`;

    }


    if(soru.altKonu){

        tags.innerHTML +=
            `<span class="tag">
                ${soru.altKonu}
            </span>`;

    }


    if(soru.zorluk){

        tags.innerHTML +=
            `<span class="tag">
                ${soru.zorluk}
            </span>`;

    }


    /* SEÇENEKLER */

    const options =
        document.getElementById("options");

    options.innerHTML = "";


    const harfler =
        ["A","B","C","D","E"];


    harfler.forEach(harf => {

        if(
            soru.secenekler[harf] === undefined
        ){
            return;
        }


        const option =
            document.createElement("div");


        option.className =
            "option";


        option.innerHTML = `

            <div class="option-letter">
                ${harf}
            </div>

            <div class="option-text">
                ${soru.secenekler[harf]}
            </div>

        `;


        option.onclick = () =>
            cevapSec(harf);


        options.appendChild(option);

    });


    document.getElementById(
        "explanation"
    ).style.display = "none";


    document.getElementById(
        "nextBtn"
    ).disabled = true;


    document.getElementById(
        "backBtn"
    ).disabled =
        mevcutSoru === 0;


    /* DAHA ÖNCE CEVAPLANDIYSA */

    if(
        cevaplar[mevcutSoru]
    ){

        cevabiGoster(
            cevaplar[mevcutSoru]
        );

    }

}


/* ==================================================
   CEVAP
   ================================================== */

function cevapSec(harf){

    if(
        cevaplar[mevcutSoru]
    ){
        return;
    }


    cevaplar[mevcutSoru] =
        harf;


    cevabiGoster(harf);
}


/* ==================================================
   CEVABI GÖSTER
   ================================================== */

function cevabiGoster(harf){

    const soru =
        testSorulari[mevcutSoru];


    const options =
        document.querySelectorAll(".option");


    options.forEach(option => {

        option.classList.add("disabled");


        const optionHarf =
            option
            .querySelector(".option-letter")
            .textContent
            .trim();


        if(
            optionHarf === soru.cevap
        ){

            option.classList.add("correct");

        }


        if(
            optionHarf === harf &&
            harf !== soru.cevap
        ){

            option.classList.add("wrong");

        }

    });


    document.getElementById(
        "explanation"
    ).innerHTML =
        "💡 " +
        (
            soru.aciklama ||
            "Bu soru için açıklama bulunmuyor."
        );


    document.getElementById(
        "explanation"
    ).style.display =
        "block";


    document.getElementById(
        "nextBtn"
    ).disabled = false;

}


/* ==================================================
   SONRAKİ
   ================================================== */

function nextQuestion(){

    if(
        !cevaplar[mevcutSoru]
    ){
        return;
    }


    if(
        mevcutSoru <
        testSorulari.length - 1
    ){

        mevcutSoru++;

        soruyuGoster();

    }
    else{

        testiBitir();

    }

}


/* ==================================================
   ÖNCEKİ
   ================================================== */

function previousQuestion(){

    if(
        mevcutSoru > 0
    ){

        mevcutSoru--;

        soruyuGoster();

    }

}


/* ==================================================
   TEST BİTİR
   ================================================== */

function testiBitir(){

    clearInterval(timer);


    let dogru = 0;

    let yanlis = 0;

    let bos = 0;


    testSorulari.forEach(
        (soru,index) => {

            const cevap =
                cevaplar[index];


            if(!cevap){

                bos++;

            }
            else if(
                cevap === soru.cevap
            ){

                dogru++;

            }
            else{

                yanlis++;

            }

        }
    );


    const net =
        dogru - (yanlis / 4);


    document.getElementById(
        "correct"
    ).textContent =
        dogru;


    document.getElementById(
        "wrong"
    ).textContent =
        yanlis;


    document.getElementById(
        "empty"
    ).textContent =
        bos;


    document.getElementById(
        "net"
    ).textContent =
        net.toFixed(2);


    document.getElementById(
        "testArea"
    ).style.display =
        "none";


    document.getElementById(
        "resultScreen"
    ).style.display =
        "block";

}


/* ==================================================
   YENİ TEST
   ================================================== */

function returnHome(){

    clearInterval(timer);


    document.getElementById(
        "resultScreen"
    ).style.display =
        "none";


    document.getElementById(
        "startScreen"
    ).style.display =
        "block";


    document.getElementById(
        "timer"
    ).textContent =
        "⏱️ 00:00";

}


/* ==================================================
   SAYFA AÇILINCA JSON'U YÜKLE
   ================================================== */

sorulariYukle();

</script>

</body>
</html>
